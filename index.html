<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <title>Studio Space</title>
  <link rel="manifest" href="manifest.json" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff; --surface: #f4f4f4; --surface2: #ebebeb; --surface3: #e0e0e0;
      --accent: #111111; --accent-dim: rgba(17,17,17,0.08);
      --red: #e03030; --red-dim: rgba(224,48,48,0.08);
      --green: #1a9e5c; --text: #111111; --muted: #888888; --muted2: #bbbbbb;
      --border: #e0e0e0; --radius: 18px;
      --font-display: 'Bebas Neue', sans-serif; --font-body: 'Syne', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100dvh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    .app-header { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; background: var(--bg); }
    .logo { display: flex; align-items: center; gap: 10px; font-family: var(--font-body); font-size: 1.4rem; font-weight: 800; letter-spacing: 0.5px; color: #000; line-height: 1; }
    .logo .mic-icon { width: 32px; height: 32px; background: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .icon-btn { width: 36px; height: 36px; background: var(--surface2); border: 1px solid var(--border); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; color: var(--muted); transition: all 0.2s; }
    .icon-btn.spinning { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-bar { margin: 10px 20px 0; padding: 8px 14px; border-radius: 10px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
    .status-bar.ok   { background: rgba(26,158,92,0.07); color: var(--green); border: 1px solid rgba(26,158,92,0.2); }
    .status-bar.warn { background: var(--red-dim); color: var(--red); border: 1px solid rgba(224,48,48,0.2); }
    .status-bar.info { background: var(--accent-dim); color: #555; border: 1px solid #ddd; }
    .tabs { display: flex; margin: 16px 20px 0; background: var(--surface); border-radius: 14px; padding: 4px; gap: 3px; border: 1px solid var(--border); }
    .tab { flex: 1; padding: 10px 6px; border: none; background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 0.8rem; font-weight: 700; border-radius: 11px; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: #111; color: #fff; }
    .page { display: none; padding: 20px; animation: fadeUp 0.25s ease; }
    .page.active { display: block; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .section-title { font-family: var(--font-display); font-size: 1.7rem; letter-spacing: 2px; color: var(--text); margin-bottom: 20px; }
    .section-title span { color: #111; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
    input, select { width: 100%; background: var(--surface); border: 1.5px solid var(--border); border-radius: 13px; padding: 13px 15px; color: var(--text); font-family: var(--font-body); font-size: 0.95rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; -webkit-appearance: none; }
    input:focus, select:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
    input::placeholder { color: var(--muted2); }
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .amount-wrap { position: relative; }
    .amount-wrap input { padding-left: 34px; }
    .currency-sign { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #111; font-weight: 700; font-size: 0.95rem; pointer-events: none; }
    .clash-box { background: var(--red-dim); border: 1px solid rgba(255,80,80,0.3); border-radius: 11px; padding: 10px 14px; font-size: 0.8rem; color: var(--red); margin-bottom: 14px; display: none; align-items: center; gap: 8px; }
    .clash-box.show { display: flex; }
    .submit-btn { width: 100%; margin-top: 6px; background: #111; color: #fff; border: none; border-radius: 14px; padding: 15px; font-family: var(--font-display); font-size: 1.2rem; letter-spacing: 2.5px; cursor: pointer; transition: transform 0.15s, opacity 0.15s; box-shadow: 0 4px 16px rgba(0,0,0,0.15); }
    .submit-btn:active { transform: scale(0.97); }
    .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-spinner { display: none; }
    .submit-btn.loading .btn-text { display: none; }
    .submit-btn.loading .btn-spinner { display: inline; }
    .summary-bar { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: grid; grid-template-columns: 1fr 1px 1fr 1px 1fr; margin-bottom: 18px; }
    .summary-item { text-align: center; padding: 2px 8px; }
    .summary-divider { background: var(--border); }
    .summary-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
    .summary-value { font-family: var(--font-display); font-size: 1.4rem; color: #111; letter-spacing: 1px; }
    .date-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .date-nav-btn { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .date-nav input[type="date"] { flex: 1; text-align: center; padding: 9px 12px; font-size: 0.85rem; font-weight: 700; border-radius: 10px; }
    .filter-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; margin-bottom: 14px; }
    .filter-row::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 0.75rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .chip.active { background: #111; border-color: #111; color: #fff; }
    .booking-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 14px 14px 18px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; animation: fadeUp 0.2s ease; }
    .booking-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #111; }
    .booking-card.past::before { background: var(--muted2); }
    .booking-card.past { opacity: 0.6; }
    .card-icon { font-size: 1.5rem; flex-shrink: 0; }
    .card-info { flex: 1; min-width: 0; }
    .card-band { font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-time { font-size: 0.76rem; color: var(--muted); margin-top: 2px; }
    .card-date-lbl { font-size: 0.68rem; color: var(--muted2); margin-top: 1px; }
    .card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
    .card-amount { font-family: var(--font-display); font-size: 1.25rem; color: #111; letter-spacing: 1px; }
    .card-del { background: transparent; border: none; color: var(--muted2); font-size: 0.85rem; cursor: pointer; padding: 2px; transition: color 0.2s; }
    .card-del:hover { color: var(--red); }
    .empty-state { text-align: center; padding: 56px 20px; color: var(--muted); }
    .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.88rem; line-height: 1.7; }
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--surface2); border: 1px solid var(--border); color: var(--text); padding: 11px 22px; border-radius: 100px; font-size: 0.82rem; font-weight: 600; z-index: 1000; transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1); white-space: nowrap; max-width: 90vw; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--green); color: var(--green); }
    .toast.error { border-color: var(--red); color: var(--red); }
    /* CALENDAR */
    .cal-week-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .cal-week-nav .date-nav-btn { width: 36px; height: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .cal-week-label { flex: 1; text-align: center; font-weight: 700; font-size: 0.85rem; color: var(--text); }
    .cal-today-btn { background: #111; color: #fff; border: none; border-radius: 8px; padding: 7px 14px; font-family: var(--font-body); font-size: 0.75rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .cal-day-strip { display: grid; grid-template-columns: 40px repeat(7, 1fr); border-bottom: 1px solid var(--border); }
    .cal-day-header { text-align: center; padding: 6px 2px 8px; cursor: pointer; }
    .cal-day-header .day-name { font-size: 0.6rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
    .cal-day-header .day-num { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 3px auto 0; font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .cal-day-header.today .day-num { background: #111; color: #fff; }
    .cal-day-header.selected .day-num { background: #555; color: #fff; }
    .cal-day-header .dot-row { display: flex; justify-content: center; gap: 2px; margin-top: 3px; height: 5px; }
    .cal-day-header .booking-dot { width: 4px; height: 4px; border-radius: 50%; background: #111; }
    .cal-grid-wrap { overflow-y: auto; max-height: calc(100dvh - 310px); scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
    .cal-hour-row { display: grid; grid-template-columns: 40px repeat(7, 1fr); min-height: 48px; }
    .cal-time-label { font-size: 0.6rem; color: var(--muted); text-align: right; padding: 0 6px 0 0; margin-top: -7px; user-select: none; min-height: 48px; }
    .cal-col { border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); min-height: 48px; position: relative; cursor: pointer; }
    .cal-col:hover { background: var(--surface); }
    .cal-booking { position: absolute; left: 2px; right: 2px; top: 0; background: #111; color: #fff; border-radius: 6px; padding: 3px 5px; font-size: 0.67rem; font-weight: 700; overflow: hidden; cursor: pointer; z-index: 10; line-height: 1.3; box-shadow: 0 2px 6px rgba(0,0,0,0.12); }
    .cal-booking:active { opacity: 0.8; }
    .cal-booking .cb-band { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cal-booking .cb-time { font-size: 0.58rem; opacity: 0.7; font-weight: 400; }
    .cal-now-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--red); z-index: 20; pointer-events: none; }
    .cal-now-dot { position: absolute; left: -3px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
    .cal-detail { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-top: 12px; display: none; }
    .cal-detail.show { display: block; }
    .cal-detail-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 10px; }
    .cal-slot { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .cal-slot:last-child { border-bottom: none; }
    .cal-slot-time { font-size: 0.75rem; color: var(--muted); width: 90px; flex-shrink: 0; }
    .cal-slot-band { font-size: 0.85rem; font-weight: 700; flex: 1; }
    .cal-slot-amt { font-family: var(--font-display); font-size: 1rem; color: #111; }
    .cal-free-msg { font-size: 0.82rem; color: var(--muted); text-align: center; padding: 16px 0; }
  </style>
</head>
<body>

<header class="app-header">
  <div class="logo"><div class="mic-icon">🎤</div>Studio Space</div>
  <div class="header-right">
    <button class="icon-btn" id="syncBtn" onclick="syncNow()">↻</button>
  </div>
</header>

<div class="status-bar info" id="statusBar">
  <span id="statusMsg">Connecting…</span>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('book')">📋 Book</button>
  <button class="tab" onclick="switchTab('schedule')">🎸 Schedule</button>
  <button class="tab" onclick="switchTab('calendar')">📅 Calendar</button>
  <button class="tab" onclick="switchTab('stats')">📊 Stats</button>
</div>

<!-- BOOK -->
<div class="page active" id="page-book">
  <p class="section-title" style="margin-top:18px">New <span>Booking</span></p>
  <div class="field">
    <label>Band Name <span style="color:var(--red)">★</span></label>
    <input type="text" id="bandName" placeholder="e.g. XYZ Rockers" autocomplete="off" />
  </div>
  <div class="field">
    <label>Date <span style="color:var(--red)">★</span></label>
    <input type="date" id="bookDate" />
  </div>
  <div class="time-row">
    <div class="field"><label>From <span style="color:var(--red)">★</span></label><input type="time" id="fromTime" onchange="checkClash()" /></div>
    <div class="field"><label>To <span style="color:var(--red)">★</span></label><input type="time" id="toTime" onchange="checkClash()" /></div>
  </div>
  <div class="clash-box" id="clashBox"><span>⚠️</span><span id="clashMsg"></span></div>
  <div class="field">
    <label>Amount Collected (₹) <span style="color:var(--red)">★</span></label>
    <div class="amount-wrap">
      <span class="currency-sign">₹</span>
      <input type="number" id="amount" placeholder="0" inputmode="numeric" min="0" />
    </div>
  </div>
  <div class="field">
    <label>Notes <span style="font-size:0.62rem;color:var(--muted);font-weight:400;letter-spacing:0;text-transform:none;">(optional)</span></label>
    <input type="text" id="notes" placeholder="e.g. needs drum kit" autocomplete="off" />
  </div>
  <button class="submit-btn" id="submitBtn" onclick="addBooking()">
    <span class="btn-text">CONFIRM BOOKING</span>
    <span class="btn-spinner">SAVING…</span>
  </button>
</div>

<!-- SCHEDULE -->
<div class="page" id="page-schedule">
  <div class="summary-bar">
    <div class="summary-item"><div class="summary-label">Bookings</div><div class="summary-value" id="sumCount">0</div></div>
    <div class="summary-divider"></div>
    <div class="summary-item"><div class="summary-label">Collected</div><div class="summary-value" id="sumAmount">₹0</div></div>
    <div class="summary-divider"></div>
    <div class="summary-item"><div class="summary-label">Hours</div><div class="summary-value" id="sumHours">0h</div></div>
  </div>
  <div class="date-nav">
    <button class="date-nav-btn" onclick="shiftDate(-1)">‹</button>
    <input type="date" id="scheduleDate" onchange="renderSchedule()" />
    <button class="date-nav-btn" onclick="shiftDate(1)">›</button>
  </div>
  <div class="filter-row">
    <button class="chip active" onclick="setFilter('day',this)">This Day</button>
    <button class="chip" onclick="setFilter('all',this)">All</button>
    <button class="chip" onclick="setFilter('upcoming',this)">Upcoming</button>
    <button class="chip" onclick="setFilter('past',this)">Past</button>
  </div>
  <div id="bookingList"></div>
</div>

<!-- CALENDAR -->
<div class="page" id="page-calendar">
  <div class="cal-week-nav" style="margin-top:18px;">
    <button class="date-nav-btn" onclick="shiftWeek(-1)">‹</button>
    <div class="cal-week-label" id="calWeekLabel"></div>
    <button class="cal-today-btn" onclick="jumpToToday()">Today</button>
    <button class="date-nav-btn" onclick="shiftWeek(1)">›</button>
  </div>
  <div style="border:1px solid var(--border);border-radius:14px;overflow:hidden;">
    <div class="cal-day-strip" id="calDayStrip"></div>
    <div class="cal-grid-wrap" id="calGridWrap"></div>
  </div>
  <div class="cal-detail" id="calDetail">
    <div class="cal-detail-title" id="calDetailTitle"></div>
    <div id="calDetailBody"></div>
  </div>
</div>

<!-- STATS -->
<div class="page" id="page-stats">
  <p class="section-title" style="margin-top:18px">Revenue <span>Stats</span></p>
  <div id="statsContent"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── CONFIG — injected by GitHub Actions ──
const SCRIPT_URL = '%%SCRIPT_URL%%';

const LOCAL_KEY   = 'studiospace_local';
const ICONS       = ['🎸','🥁','🎹','🎺','🎻','🎷','🎤','🪗'];
let bookings      = [];
let currentFilter = 'day';
let isSyncing     = false;
let calWeekOffset = 0;
let calSelectedDay = null;
const CAL_START_HOUR = 8;
const CAL_END_HOUR   = 22;
const HOUR_PX        = 48;
const DAY_NAMES      = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

// ── INIT ──
window.addEventListener('DOMContentLoaded', () => {
  const today = todayStr();
  document.getElementById('bookDate').value     = today;
  document.getElementById('scheduleDate').value = today;
  calSelectedDay = today;
  document.getElementById('bookDate').addEventListener('change', checkClash);
  loadFromSheets();
});

// ── UTILS ──
const todayStr   = () => new Date().toISOString().split('T')[0];
const timeToMins = t  => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const getLocal   = () => JSON.parse(localStorage.getItem(LOCAL_KEY) || '[]');
const saveLocal  = d  => localStorage.setItem(LOCAL_KEY, JSON.stringify(d));

function safeTime(val) {
  if (!val) return '--:--';
  const str = val.toString().trim();
  if (/^\d{2}:\d{2}$/.test(str)) return str;
  const d = new Date(str);
  if (!isNaN(d)) return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  return str;
}
function safeDate(val) {
  if (!val) return '';
  const str = val.toString().trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  const d = new Date(str);
  if (!isNaN(d)) return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
  return str;
}
function formatDate(dateStr) {
  const clean = safeDate(dateStr);
  const d = new Date(clean + 'T00:00:00');
  const t = todayStr();
  const tom = new Date(); tom.setDate(tom.getDate()+1);
  if (clean === t) return 'Today';
  if (clean === tom.toISOString().split('T')[0]) return 'Tomorrow';
  if (isNaN(d)) return clean;
  return d.toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });
}
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => t.className = 'toast', 2800);
}
function setStatus(type, msg) {
  document.getElementById('statusBar').className = 'status-bar ' + type;
  document.getElementById('statusMsg').textContent = msg;
}

// ── SHEETS ──
// Use XMLHttpRequest instead of fetch — iOS WebKit handles
// Apps Script redirects correctly with XHR but blocks fetch.
function xhrGet(url) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { reject(new Error('Invalid JSON')); }
    };
    xhr.onerror   = () => reject(new Error('Network error'));
    xhr.ontimeout = () => reject(new Error('Timeout'));
    xhr.timeout   = 15000;
    xhr.send();
  });
}

async function loadFromSheets() {
  setSpin(true);
  try {
    const data = await xhrGet(`${SCRIPT_URL}?action=getAll`);
    if (data.status === 'ok') {
      bookings = (data.bookings || []).map(b => ({ ...b, date: safeDate(b.date), from: safeTime(b.from), to: safeTime(b.to) }));
      saveLocal(bookings);
      setStatus('ok', '✓ Synced · ' + bookings.length + ' bookings');
    } else throw new Error(data.message);
  } catch {
    bookings = getLocal();
    setStatus('warn', '⚠ Offline — showing local data');
  } finally {
    setSpin(false);
    renderSchedule(); renderStats(); renderCalendar();
  }
}

async function pushToSheets(booking) {
  try {
    const data = await xhrGet(`${SCRIPT_URL}?action=add&data=${encodeURIComponent(JSON.stringify(booking))}`);
    return data.status === 'ok';
  } catch { return false; }
}

async function deleteFromSheets(id) {
  try {
    const data = await xhrGet(`${SCRIPT_URL}?action=delete&id=${encodeURIComponent(id)}`);
    return data.status === 'ok';
  } catch { return false; }
}
function setSpin(on) { isSyncing = on; document.getElementById('syncBtn').classList.toggle('spinning', on); }
async function syncNow() {
  if (isSyncing) return;
  setStatus('info', 'Syncing…');
  await loadFromSheets();
  showToast('Synced!', 'success');
}

// ── CLASH ──
function checkClash() {
  const date = document.getElementById('bookDate').value;
  const from = document.getElementById('fromTime').value;
  const to   = document.getElementById('toTime').value;
  const box  = document.getElementById('clashBox');
  const msg  = document.getElementById('clashMsg');
  if (!date || !from || !to) { box.classList.remove('show'); return false; }
  const nF = timeToMins(from), nT = timeToMins(to);
  if (nT <= nF) { msg.textContent = '"To" must be after "From".'; box.classList.add('show'); return true; }
  const clash = bookings.find(b => b.date === date && nF < timeToMins(b.to) && nT > timeToMins(b.from));
  if (clash) { msg.textContent = `Clashes with ${clash.band} (${clash.from}–${clash.to})`; box.classList.add('show'); return true; }
  box.classList.remove('show'); return false;
}

// ── ADD BOOKING ──
async function addBooking() {
  const band   = document.getElementById('bandName').value.trim();
  const date   = document.getElementById('bookDate').value;
  const from   = document.getElementById('fromTime').value;
  const to     = document.getElementById('toTime').value;
  const amount = document.getElementById('amount').value;
  const notes  = document.getElementById('notes').value.trim();
  if (!band || !date || !from || !to || !amount) { showToast('Fill all required fields', 'error'); return; }
  if (checkClash()) { showToast('Fix the slot clash first', 'error'); return; }
  const btn = document.getElementById('submitBtn');
  btn.classList.add('loading'); btn.disabled = true;
  const booking = { id: Date.now().toString(), band, date, from, to, amount: parseFloat(amount), notes, createdAt: new Date().toISOString() };
  const ok = await pushToSheets(booking);
  if (ok) {
    bookings.push(booking); saveLocal(bookings);
    showToast('✅ Saved to Google Sheets!', 'success');
    setStatus('ok', '✓ Synced · ' + bookings.length + ' bookings');
  } else {
    booking._pending = true; bookings.push(booking); saveLocal(bookings);
    showToast('Saved locally (offline)', '');
    setStatus('warn', '⚠ Offline — tap ↻ to sync');
  }
  ['bandName','fromTime','toTime','amount','notes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('bookDate').value = todayStr();
  document.getElementById('clashBox').classList.remove('show');
  btn.classList.remove('loading'); btn.disabled = false;
  switchTab('schedule');
}

// ── DELETE ──
async function deleteBooking(id) {
  if (!confirm('Remove this booking?')) return;
  setSpin(true); await deleteFromSheets(id); setSpin(false);
  bookings = bookings.filter(b => b.id !== id);
  saveLocal(bookings); renderSchedule(); renderStats();
  showToast('Booking removed');
}

// ── SCHEDULE ──
function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active'); renderSchedule();
}
function shiftDate(delta) {
  const el = document.getElementById('scheduleDate');
  const dt = new Date(el.value + 'T00:00:00');
  dt.setDate(dt.getDate() + delta);
  el.value = dt.getFullYear() + '-' + (dt.getMonth()+1).toString().padStart(2,'0') + '-' + dt.getDate().toString().padStart(2,'0');
  renderSchedule();
}
function renderSchedule() {
  const list  = document.getElementById('bookingList');
  const sel   = document.getElementById('scheduleDate').value;
  const today = todayStr();
  let filtered = [...bookings];
  if (currentFilter === 'day')           filtered = filtered.filter(b => b.date === sel);
  else if (currentFilter === 'upcoming') filtered = filtered.filter(b => b.date >= today);
  else if (currentFilter === 'past')     filtered = filtered.filter(b => b.date < today);
  filtered.sort((a,b) => a.date === b.date ? a.from.localeCompare(b.from) : a.date.localeCompare(b.date));
  const ss = currentFilter === 'day' ? filtered : bookings;
  const tm = ss.reduce((s,b) => s + (timeToMins(b.to) - timeToMins(b.from)), 0);
  document.getElementById('sumCount').textContent  = ss.length;
  document.getElementById('sumAmount').textContent = '₹' + ss.reduce((s,b) => s+b.amount, 0).toLocaleString('en-IN');
  document.getElementById('sumHours').textContent  = (tm/60).toFixed(1) + 'h';
  if (!filtered.length) { list.innerHTML = `<div class="empty-state"><div class="empty-icon">🎸</div><p>No bookings here.<br/>Use the Book tab to add one!</p></div>`; return; }
  list.innerHTML = filtered.map((b,i) => `
    <div class="booking-card ${b.date < today ? 'past' : ''}">
      <div class="card-icon">${ICONS[i % ICONS.length]}</div>
      <div class="card-info">
        <div class="card-band">${b.band}${b._pending ? ' 🔄' : ''}</div>
        <div class="card-time">${safeTime(b.from)} – ${safeTime(b.to)}${b.notes ? ' · ' + b.notes : ''}</div>
        <div class="card-date-lbl">${formatDate(b.date)}</div>
      </div>
      <div class="card-right">
        <div class="card-amount">₹${b.amount.toLocaleString('en-IN')}</div>
        <button class="card-del" onclick="deleteBooking('${b.id}')">✕</button>
      </div>
    </div>`).join('');
}

// ── STATS ──
function renderStats() {
  const el = document.getElementById('statsContent');
  if (!bookings.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><p>No data yet.</p></div>`; return; }
  const byMonth = {}, byBand = {};
  const grandTotal = bookings.reduce((s,b) => s + b.amount, 0);
  bookings.forEach(b => {
    const key = b.date.slice(0,7);
    if (!byMonth[key]) byMonth[key] = { total:0, count:0, hours:0 };
    byMonth[key].total += b.amount; byMonth[key].count++;
    byMonth[key].hours += (timeToMins(b.to) - timeToMins(b.from)) / 60;
    if (!byBand[b.band]) byBand[b.band] = { total:0, count:0 };
    byBand[b.band].total += b.amount; byBand[b.band].count++;
  });
  const months   = Object.entries(byMonth).sort((a,b) => b[0].localeCompare(a[0]));
  const topBands = Object.entries(byBand).sort((a,b) => b[1].total - a[1].total).slice(0,5);
  const card = c => `<div style="background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;">${c}</div>`;
  const sec  = t => `<div style="font-family:var(--font-display);font-size:1rem;letter-spacing:2px;color:var(--muted);margin:18px 0 12px;">${t}</div>`;
  el.innerHTML =
    card(`<div style="font-size:0.68rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;">All-Time Revenue</div>
      <div style="font-family:var(--font-display);font-size:2.4rem;color:#111;letter-spacing:2px;">₹${grandTotal.toLocaleString('en-IN')}</div>
      <div style="font-size:0.78rem;color:var(--muted);margin-top:4px;">${bookings.length} total bookings</div>`) +
    sec('MONTHLY') +
    months.map(([key,val]) => {
      const label = new Date(key+'-01').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
      const pct   = Math.round((val.total/grandTotal)*100);
      return card(`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-weight:700;font-size:0.88rem;">${label}</span>
          <span style="font-family:var(--font-display);font-size:1.2rem;color:#111;">₹${val.total.toLocaleString('en-IN')}</span>
        </div>
        <div style="background:var(--surface2);border-radius:4px;height:4px;margin-bottom:8px;">
          <div style="background:#111;height:4px;border-radius:4px;width:${pct}%;"></div>
        </div>
        <div style="font-size:0.72rem;color:var(--muted);">${val.count} bookings · ${val.hours.toFixed(1)}h booked</div>`);
    }).join('') +
    sec('TOP BANDS') +
    topBands.map(([band,val],i) => card(`
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="font-family:var(--font-display);font-size:1.4rem;color:var(--muted2);width:24px;text-align:center;">${i+1}</div>
        <div style="flex:1;font-weight:700;font-size:0.9rem;">${band}</div>
        <div style="text-align:right;">
          <div style="font-family:var(--font-display);font-size:1.1rem;color:#111;">₹${val.total.toLocaleString('en-IN')}</div>
          <div style="font-size:0.68rem;color:var(--muted);">${val.count} sessions</div>
        </div>
      </div>`)).join('');
}

// ── TABS ──
function switchTab(tab) {
  const tabs = ['book','schedule','calendar','stats'];
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', tabs[i] === tab));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  if (tab === 'schedule') renderSchedule();
  if (tab === 'stats')    renderStats();
  if (tab === 'calendar') renderCalendar();
}

// ── CALENDAR ──
function getWeekDates(offset) {
  const now = new Date();
  const monday = new Date(now);
  monday.setDate(now.getDate() - now.getDay() + 1 + offset * 7);
  monday.setHours(0,0,0,0);
  return Array.from({length:7}, (_,i) => { const d = new Date(monday); d.setDate(monday.getDate()+i); return d; });
}
function dateToStr(d) {
  return d.getFullYear() + '-' + (d.getMonth()+1).toString().padStart(2,'0') + '-' + d.getDate().toString().padStart(2,'0');
}
function shiftWeek(delta) { calWeekOffset += delta; renderCalendar(); }
function jumpToToday() { calWeekOffset = 0; calSelectedDay = todayStr(); renderCalendar(); showDayDetail(todayStr()); }

function renderCalendar() {
  const days      = getWeekDates(calWeekOffset);
  const today     = todayStr();
  const startMins = CAL_START_HOUR * 60;
  const endMins   = CAL_END_HOUR * 60;
  const fmt = d => d.toLocaleDateString('en-IN', { day:'numeric', month:'short' });
  document.getElementById('calWeekLabel').textContent = fmt(days[0]) + ' – ' + fmt(days[6]) + ' ' + days[6].getFullYear();
  const bMap = {};
  bookings.forEach(b => { if (!bMap[b.date]) bMap[b.date] = []; bMap[b.date].push(b); });

  // Day headers
  const strip = document.getElementById('calDayStrip');
  strip.innerHTML = '<div></div>';
  days.forEach(d => {
    const ds  = dateToStr(d);
    const div = document.createElement('div');
    div.className = 'cal-day-header' + (ds === today ? ' today' : '') + (ds === calSelectedDay && ds !== today ? ' selected' : '');
    const dots = (bMap[ds] || []).slice(0,3).map(() => '<span class="booking-dot"></span>').join('');
    div.innerHTML = `<div class="day-name">${DAY_NAMES[d.getDay()]}</div><div class="day-num">${d.getDate()}</div><div class="dot-row">${dots}</div>`;
    div.onclick = () => { calSelectedDay = ds; renderCalendar(); showDayDetail(ds); };
    strip.appendChild(div);
  });

  // Block map
  const blockMap = {};
  days.forEach((d, colIdx) => {
    const ds = dateToStr(d);
    (bMap[ds] || []).forEach(b => {
      const fMins = timeToMins(safeTime(b.from));
      const tMins = timeToMins(safeTime(b.to));
      if (tMins <= startMins || fMins >= endMins) return;
      const cFrom  = Math.max(fMins, startMins);
      const cTo    = Math.min(tMins, endMins);
      const startH = Math.floor(cFrom / 60);
      const topOff = ((cFrom - startH * 60) / 60) * HOUR_PX;
      const hPx    = Math.max(((cTo - cFrom) / 60) * HOUR_PX, 18);
      const key    = colIdx + ':' + startH;
      if (!blockMap[key]) blockMap[key] = [];
      blockMap[key].push({ b, topOff, hPx, ds });
    });
  });

  // Time grid
  const wrap    = document.getElementById('calGridWrap');
  wrap.innerHTML = '';
  const nowD    = new Date();
  const nowMins = nowD.getHours() * 60 + nowD.getMinutes();
  const nowCol  = days.findIndex(d => dateToStr(d) === dateToStr(nowD));

  for (let h = CAL_START_HOUR; h < CAL_END_HOUR; h++) {
    const row = document.createElement('div');
    row.className = 'cal-hour-row';
    const lbl = document.createElement('div');
    lbl.className = 'cal-time-label';
    lbl.textContent = (h === 12 ? 12 : h % 12) + (h < 12 ? 'am' : 'pm');
    row.appendChild(lbl);
    days.forEach((d, colIdx) => {
      const ds  = dateToStr(d);
      const col = document.createElement('div');
      col.className = 'cal-col';
      col.onclick = () => {
        document.getElementById('bookDate').value = ds;
        document.getElementById('fromTime').value = h.toString().padStart(2,'0') + ':00';
        document.getElementById('toTime').value   = (h+1).toString().padStart(2,'0') + ':00';
        switchTab('book');
      };
      (blockMap[colIdx + ':' + h] || []).forEach(({ b, topOff, hPx, ds: bds }) => {
        const block = document.createElement('div');
        block.className  = 'cal-booking';
        block.style.top  = topOff + 'px';
        block.style.height = hPx + 'px';
        block.innerHTML  = `<div class="cb-band">${b.band}</div>` + (hPx > 28 ? `<div class="cb-time">${safeTime(b.from)}–${safeTime(b.to)}</div>` : '');
        block.onclick = e => { e.stopPropagation(); calSelectedDay = bds; renderCalendar(); showDayDetail(bds); };
        col.appendChild(block);
      });
      if (colIdx === nowCol && h === nowD.getHours() && nowMins >= startMins && nowMins <= endMins) {
        const line = document.createElement('div');
        line.className = 'cal-now-line';
        line.style.top = ((nowMins - h * 60) / 60) * HOUR_PX + 'px';
        line.innerHTML = '<div class="cal-now-dot"></div>';
        col.appendChild(line);
      }
      row.appendChild(col);
    });
    wrap.appendChild(row);
  }
  wrap.scrollTop = calWeekOffset === 0 ? Math.max(0, ((nowMins - startMins - 60) / 60) * HOUR_PX) : 0;
  if (calSelectedDay) showDayDetail(calSelectedDay);
}

function showDayDetail(ds) {
  const detail = document.getElementById('calDetail');
  const title  = document.getElementById('calDetailTitle');
  const body   = document.getElementById('calDetailBody');
  title.textContent = new Date(ds + 'T00:00:00').toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long' });
  const dayBs = bookings.filter(b => b.date === ds).sort((a,b) => a.from.localeCompare(b.from));
  body.innerHTML = !dayBs.length
    ? '<div class="cal-free-msg">✅ No bookings — day is fully available</div>'
    : dayBs.map(b => `
        <div class="cal-slot">
          <div class="cal-slot-time">${safeTime(b.from)} – ${safeTime(b.to)}</div>
          <div class="cal-slot-band">${b.band}${b.notes ? '<br><span style="font-size:0.72rem;color:var(--muted);font-weight:400;">' + b.notes + '</span>' : ''}</div>
          <div class="cal-slot-amt">₹${b.amount.toLocaleString('en-IN')}</div>
        </div>`).join('');
  detail.classList.add('show');
}
