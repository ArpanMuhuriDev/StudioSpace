name: Build and Deploy StudioSpace
on:
  push:
    branches:
      - main
      - Develop

jobs:
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject Script URL into index.html
        env:
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
        run: |
          python3 -c "
          import os
          url = os.environ['SCRIPT_URL'].strip()
          with open('index.html', 'r') as f:
              content = f.read()
          content = content.replace('%%SCRIPT_URL%%', url)
          with open('index.html', 'w') as f:
              f.write(content)
          print('SCRIPT_URL starts with:', url[:40])
          "

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: .

  deploy-test:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject Script URL into index.html
        env:
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
        run: |
          python3 -c "
          import os
          url = os.environ['SCRIPT_URL'].strip()
          with open('index.html', 'r') as f:
              content = f.read()
          content = content.replace('%%SCRIPT_URL%%', url)
          with open('index.html', 'w') as f:
              f.write(content)
          print('SCRIPT_URL starts with:', url[:40])
          "

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          destination_dir: test
