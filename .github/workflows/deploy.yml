name: Build and Deploy StudioSpace

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject Script URL into index.html
        env:
          SCRIPT_URL: ${{ vars.SCRIPT_URL }}
        run: |
          python3 -c "
          import os
          url = os.environ['SCRIPT_URL']
          with open('index.html', 'r') as f:
              content = f.read()
          content = content.replace('%%SCRIPT_URL%%', url)
          with open('index.html', 'w') as f:
              f.write(content)
          print('Replaced SCRIPT_URL successfully')
          print('URL starts with:', url[:40])
          "

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
