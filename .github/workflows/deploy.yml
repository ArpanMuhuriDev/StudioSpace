name: Build and Deploy StudioSpace

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inject secrets into index.html
        run: |
          sed -i "s|%%SCRIPT_URL%%|${{ vars.SCRIPT_URL }}|g" index.html
          sed -i "s|%%APP_TOKEN%%|${{ secrets.APP_TOKEN }}|g" index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
